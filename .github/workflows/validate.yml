name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate source and deployment candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @sei/api db:check
      - run: pnpm smoke:check
      - run: pnpm smoke:preview -- --validate-config
        env:
          PREVIEW_API_BASE_URL: https://api-preview.example.com/api/v1
          PREVIEW_WEB_URL: https://web-preview.example.com
      - run: pnpm audit --prod --audit-level high
      - run: docker build --file apps/api/Dockerfile --tag sei-api:m8-test .
      - run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg VITE_API_BASE_URL=https://api-preview.example.com/api/v1
          --tag sei-web:m8-test
          .
